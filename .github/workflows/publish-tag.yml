name: Publish Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version zum Publish (z.B. 8.5, 8.5.2)'
        required: true

env:
  REGISTRY_IMAGE: malacay1462/php-environment

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create version tag from latest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:${{ github.event.inputs.version }} \
            ${{ env.REGISTRY_IMAGE }}:latest

      - name: Verify tag
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ github.event.inputs.version }}
